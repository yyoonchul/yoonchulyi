name: Send newsletter

# Runs only after a successful deploy, so a post is live before anyone is
# emailed a link to it. Never runs on its own schedule — no deploy, no email.
on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be sent without sending"
        type: boolean
        default: true

permissions:
  contents: write

# One send at a time: concurrent runs could read the same state and email the
# same post twice.
concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send newsletter for new posts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_EN: ${{ vars.RESEND_SEGMENT_EN }}
          RESEND_SEGMENT_KO: ${{ vars.RESEND_SEGMENT_KO }}
          RESEND_TOPIC_ESSAYS: ${{ vars.RESEND_TOPIC_ESSAYS }}
          RESEND_TOPIC_DAILY: ${{ vars.RESEND_TOPIC_DAILY }}
        run: |
          npx tsx scripts/newsletter/send.ts \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Record what was sent
        run: |
          if git diff --quiet -- .newsletter-state.json; then
            echo "no new sends to record"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .newsletter-state.json
          git commit -m "chore(newsletter): record sent posts"
          git push
