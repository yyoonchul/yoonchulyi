name: Deploy to Cloudflare Workers

on:
  # main 브랜치에 푸시될 때마다 실행
  push:
    branches: [ main ]
    # 뉴스레터 발송 기록은 사이트 내용과 무관하므로 재배포하지 않는다
    # (재배포 → 발송 워크플로우 재실행 루프 방지)
    paths-ignore:
      - '.newsletter-state.json'
  # 수동으로도 실행 가능하게 설정
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않도록 (앞선 실행은 취소하지 않고 순서대로 처리)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # v4 runs on node24 and uses the repo's pinned wrangler rather than
      # installing its own, which would conflict with @cloudflare/workers-types.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
