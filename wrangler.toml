name = "yoonchulyi"
compatibility_date = "2026-08-20"
main = "./worker/index.ts"

# Both hostnames served the site under GitHub Pages, so both stay bound here.
routes = [
  { pattern = "yoonchulyi.com", custom_domain = true },
  { pattern = "www.yoonchulyi.com", custom_domain = true },
]

# Only these paths reach the Worker; everything else is served straight from
# the CDN without running any code. /admin is here for a second reason: the
# password gate lives in the Worker, so any admin path the CDN could answer on
# its own would be a path around the gate.
[assets]
directory = "./dist/"
binding = "ASSETS"
run_worker_first = ["/api/*", "/about", "/about/", "/admin", "/admin/*"]

# Not credentials — the Resend API key is the thing that must stay secret.
# Language picks the segment, topic picks what they opted into; a broadcast
# targets one of each.
[vars]
RESEND_SEGMENT_EN = "7cd6b9d0-6487-4095-b448-96eabf181e82"
RESEND_SEGMENT_KO = "a45bef24-0b37-4901-b6ad-d8f87f42f9cd"
RESEND_TOPIC_ESSAYS = "82d8b4be-5f0e-4695-b513-c773a7c474a9"
RESEND_TOPIC_DAILY = "52cde607-0aef-4096-b665-0b45519f0c96"

# /api/subscribe sends mail on an anonymous request, so it is capped per IP.
[[ratelimits]]
name = "SUBSCRIBE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60

# Password guessing is only expensive if we make it expensive.
[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 10
period = 60
